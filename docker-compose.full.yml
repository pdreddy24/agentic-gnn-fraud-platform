services:
  neo4j:
    image: neo4j:5.26-community
    container_name: fraud-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    depends_on:
      - neo4j
    ports:
      - "8002:8002"
    environment:
      ENABLE_NEO4J: "true"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password123"
      NEO4J_DATABASE: "neo4j"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.5}"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./audits:/app/audits

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-dashboard
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: "http://api:8002"
    command: ["streamlit", "run", "dashboard/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    volumes:
      - ./audits:/app/audits

volumes:
  neo4j_data:
  neo4j_logs:
